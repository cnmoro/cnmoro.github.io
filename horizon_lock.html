<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HORIZON LOCK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');
  :root { --accent:#00ffaa; --danger:#ff3355; --warn:#ffcc00; --dim:#555; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:'Share Tech Mono',monospace; height:100dvh; overflow:hidden; user-select:none; color:#e8e8e8; }
  #viewport { position:relative; width:100%; height:100dvh; overflow:hidden; background:#000; }
  #camFeed { display:none; }
  #previewCanvas { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; display:block; }

  #ui { position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:24px 20px 36px; z-index:10; }
  #header { display:flex; justify-content:space-between; align-items:flex-start; }
  #title { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; letter-spacing:0.1em; color:var(--accent); text-shadow:0 0 20px rgba(0,255,170,0.5); line-height:1; }
  #title span { display:block; font-size:0.55rem; letter-spacing:0.3em; color:var(--dim); font-family:'Share Tech Mono',monospace; margin-top:2px; }
  #debug { text-align:right; font-size:0.65rem; color:var(--dim); line-height:2; letter-spacing:0.05em; }
  #debug .val { color:var(--accent); }
  #debug .corr { color:var(--warn); }

  #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; opacity:0.4; pointer-events:none; }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:var(--accent); }
  #crosshair::before { width:1px; height:100%; left:50%; }
  #crosshair::after  { height:1px; width:100%; top:50%; }
  .ch-corner { position:absolute; width:10px; height:10px; border-color:var(--accent); border-style:solid; opacity:0.8; }
  .ch-corner.tl { top:0; left:0; border-width:1px 0 0 1px; }
  .ch-corner.tr { top:0; right:0; border-width:1px 1px 0 0; }
  .ch-corner.bl { bottom:0; left:0; border-width:0 0 1px 1px; }
  .ch-corner.br { bottom:0; right:0; border-width:0 1px 1px 0; }

  #horizonLine { position:absolute; left:5%; right:5%; top:50%; height:1px; background:linear-gradient(90deg,transparent,var(--warn),transparent); opacity:0; transition:opacity 0.3s; pointer-events:none; }
  #horizonLine.active { opacity:0.7; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.7} 50%{opacity:.25} }

  #tiltIndicator { position:absolute; bottom:200px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0; transition:opacity 0.3s; }
  #tiltIndicator.visible { opacity:1; }
  #tiltBar { width:200px; height:3px; background:#222; border-radius:2px; position:relative; }
  #tiltCenter { position:absolute; top:-2px; left:50%; width:1px; height:7px; background:var(--dim); }
  #tiltFill { position:absolute; top:0; height:100%; width:4px; background:var(--accent); left:50%; transform:translateX(-50%); border-radius:2px; }
  #tiltValue { font-size:0.6rem; color:var(--dim); letter-spacing:0.1em; }

  #controls { display:flex; flex-direction:column; gap:12px; align-items:center; pointer-events:all; }
  #recTimer { font-size:0.65rem; letter-spacing:0.2em; color:var(--danger); opacity:0; transition:opacity 0.3s; }
  #recTimer.visible { opacity:1; }
  #statusBar { font-size:0.6rem; letter-spacing:0.2em; color:var(--dim); min-height:14px; text-align:center; }
  #statusBar.locked { color:var(--accent); }
  #statusBar.recording { color:var(--danger); animation:blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  #btnRow { display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .btn { cursor:pointer; font-family:'Bebas Neue',sans-serif; letter-spacing:0.12em; border:1px solid; background:transparent; transition:all 0.2s; -webkit-tap-highlight-color:transparent; border-radius:3px; }
  #btnHorizon { padding:10px 24px; font-size:1.1rem; border-color:var(--accent); color:var(--accent); }
  #btnHorizon.active { background:var(--accent); color:#000; box-shadow:0 0 20px rgba(0,255,170,0.4); }
  #btnRecord { width:58px; height:58px; border-radius:50%; border:2px solid var(--danger); background:transparent; position:relative; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #btnRecord::before { content:''; position:absolute; inset:5px; border-radius:50%; background:var(--danger); transition:all 0.2s; }
  #btnRecord.recording::before { border-radius:4px; inset:14px; }
  #btnRecord:active { transform:scale(0.95); }
  #btnFlip { padding:8px 16px; font-size:0.85rem; border-color:var(--dim); color:var(--dim); }
  #btnFlip.active { border-color:var(--warn); color:var(--warn); }

  #scanlines { position:absolute; inset:0; pointer-events:none; z-index:8; background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 4px); }
  #vignette  { position:absolute; inset:0; pointer-events:none; z-index:7; background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%); }

  #permOverlay { position:absolute; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; z-index:100; padding:40px; }
  #permOverlay h1 { font-family:'Bebas Neue',sans-serif; font-size:3.5rem; color:var(--accent); text-shadow:0 0 30px rgba(0,255,170,0.4); letter-spacing:0.1em; text-align:center; line-height:1; }
  #permOverlay p { color:var(--dim); font-size:0.75rem; letter-spacing:0.1em; text-align:center; line-height:1.8; max-width:280px; }
  #btnStart { padding:14px 40px; font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:0.2em; border:1px solid var(--accent); color:var(--accent); background:transparent; cursor:pointer; border-radius:3px; transition:all 0.2s; }
  #btnStart:active { background:var(--accent); color:#000; }
  #errorMsg { color:var(--danger); font-size:0.7rem; letter-spacing:0.1em; text-align:center; display:none; line-height:1.6; max-width:300px; }
</style>
</head>
<body>
<div id="viewport">
  <video id="camFeed" autoplay playsinline muted></video>
  <canvas id="previewCanvas"></canvas>
  <div id="horizonLine"></div>
  <div id="crosshair">
    <div class="ch-corner tl"></div><div class="ch-corner tr"></div>
    <div class="ch-corner bl"></div><div class="ch-corner br"></div>
  </div>
  <div id="tiltIndicator">
    <div id="tiltBar"><div id="tiltCenter"></div><div id="tiltFill"></div></div>
    <div id="tiltValue">TILT: 0.0°</div>
  </div>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <div id="ui">
    <div id="header">
      <div><div id="title">HORIZON<br>LOCK<span>STABILIZATION SYSTEM v1.2</span></div></div>
      <div id="debug">
        β <span class="val" id="dBeta">--</span><br>
        γ <span class="val" id="dGamma">--</span><br>
        ROLL <span class="val" id="dRoll">--</span><br>
        PITCH <span class="val" id="dPitch">--</span><br>
        REF <span class="val" id="dRef">--</span><br>
        CORR <span class="corr" id="dCorr">--</span>
      </div>
    </div>
    <div id="controls">
      <div id="recTimer">● REC <span id="recTime">00:00</span></div>
      <div id="statusBar">GYRO: STANDBY</div>
      <div id="btnRow">
        <button class="btn" id="btnHorizon">HOLD HORIZON</button>
        <button class="btn" id="btnRecord"></button>
        <button class="btn" id="btnFlip">FLIP</button>
      </div>
    </div>
  </div>

  <div id="permOverlay">
    <h1>HORIZON<br>LOCK</h1>
    <p>GYROSCOPE-STABILIZED CAMERA<br><br>REQUIRES ACCESS TO:<br>CAMERA · GYROSCOPE · MICROPHONE</p>
    <button id="btnStart">INITIALIZE</button>
    <div id="errorMsg"></div>
  </div>
</div>

<script>
(function () {
  // ── State ──────────────────────────────────────────────────────────────────
  let rawStream       = null;
  let canvasStream    = null;
  let mediaRecorder   = null;
  let chunks          = [];
  let isRecording     = false;
  let intentionalStop = false;

  let horizonLocked   = false;
  let signFlip        = 1;
  
  // Sensor Inputs (Raw)
  let sensorRoll      = 0;
  let sensorPitch     = 0;
  
  // Render State (The "Chasers")
  let renderRoll      = 0;
  let renderPitch     = 0;
  
  // Reference State
  let refRoll         = 0;
  let refPitch        = 0;

  let gyroActive      = false;
  let systemReady     = false;
  let lastTime        = 0;
  let lastScreenAngle = null;

  // ── NEW: Smoothing Configuration ───────────────────────────────────────────
  // Fixed time constant for consistent smoothing regardless of frame rate
  const SMOOTH_TIME_ROLL  = 0.18;  // Seconds (lower = faster response)
  const SMOOTH_TIME_PITCH = 0.22;  // Slightly slower for pitch to reduce jitter
  const PITCH_MAX_CORRECTION = 60; // Increased from 45° to reduce lag

  // ── DOM ────────────────────────────────────────────────────────────────────
  const camFeed     = document.getElementById('camFeed');
  const canvas      = document.getElementById('previewCanvas');
  const ctx         = canvas.getContext('2d');
  const permOverlay = document.getElementById('permOverlay');
  const errorMsg    = document.getElementById('errorMsg');
  const statusBar   = document.getElementById('statusBar');
  const horizonLine = document.getElementById('horizonLine');
  const tiltInd     = document.getElementById('tiltIndicator');
  const tiltFill    = document.getElementById('tiltFill');
  const tiltValue   = document.getElementById('tiltValue');
  const recTimer    = document.getElementById('recTimer');
  const recTimeEl   = document.getElementById('recTime');
  const dBeta       = document.getElementById('dBeta');
  const dGamma      = document.getElementById('dGamma');
  const dRoll       = document.getElementById('dRoll');
  const dPitch      = document.getElementById('dPitch');
  const dRef        = document.getElementById('dRef');
  const dCorr       = document.getElementById('dCorr');
  const btnStart    = document.getElementById('btnStart');
  const btnHorizon  = document.getElementById('btnHorizon');
  const btnRecord   = document.getElementById('btnRecord');
  const btnFlip     = document.getElementById('btnFlip');

  // ── Math Utilities ───────────────────────────────────────────────────────────
  
  function normalizeAngle(angle) {
    return ((angle + 180) % 360 + 360) % 360 - 180;
  }

  function lerpAngle(from, to, t) {
    let diff = normalizeAngle(to - from);
    return from + diff * t;
  }

  function lerp(from, to, t) {
    return from + (to - from) * t;
  }

  function getScreenAngle() {
    let angle = 0;
    if (screen && screen.orientation && screen.orientation.angle !== undefined) {
      angle = screen.orientation.angle;
    } else if (typeof window.orientation !== 'undefined') {
      angle = window.orientation;
    }
    return ((angle + 180) % 360 + 360) % 360 - 180;
  }

  // ── FIXED: Proper Pitch & Roll Calculation ─────────────────────────────────
  function computeOrientation(beta, gamma, screenAngle) {
    const rad = Math.PI / 180;
    const b = beta * rad;
    const g = gamma * rad;
    const sa = screenAngle * rad;

    // Calculate device orientation in world coordinates
    // This properly accounts for screen rotation
    const sinSa = Math.sin(sa);
    const cosSa = Math.cos(sa);
    const sinB = Math.sin(b);
    const cosB = Math.cos(b);
    const sinG = Math.sin(g);
    const cosG = Math.cos(g);

    // World-space up vector components
    const x_up = -sinG * cosB;
    const y_up = sinB;
    const z_up = cosG * cosB;

    // Rotate by screen angle to get screen-relative coordinates
    const x_screen = x_up * cosSa - y_up * sinSa;
    const y_screen = x_up * sinSa + y_up * cosSa;

    // Calculate roll (rotation around Z-axis of screen)
    let roll = Math.atan2(x_screen, y_screen) * 180 / Math.PI;
    
    // Calculate pitch (tilt forward/backward relative to horizon)
    // Using the Z component for more accurate pitch at extreme angles
    let pitch = Math.asin(y_screen) * 180 / Math.PI;
    
    // Alternative pitch calculation that works better at extreme angles
    const pitchAlt = Math.atan2(y_screen, Math.sqrt(x_screen * x_screen + z_up * z_up)) * 180 / Math.PI;
    
    // Blend between the two for smoother behavior across all angles
    const blendFactor = Math.abs(beta - 90) / 90; // 0 at 90°, 1 at 0° or 180°
    pitch = lerp(pitchAlt, pitch, blendFactor);

    return { roll: normalizeAngle(roll), pitch: pitch };
  }

  // ── Gyroscope Handling ───────────────────────────────────────────────────────
  function handleOrientation(e) {
    gyroActive = true;
    let beta = e.beta || 0;
    let gamma = e.gamma || 0;
    let screenAngle = getScreenAngle();

    // Use proper orientation calculation
    const orientation = computeOrientation(beta, gamma, screenAngle);
    sensorRoll = orientation.roll;
    sensorPitch = orientation.pitch;

    // Update Debug UI
    dBeta.textContent   = beta.toFixed(1)   + '°';
    dGamma.textContent  = gamma.toFixed(1)  + '°';
    dRoll.textContent   = sensorRoll.toFixed(1)   + '°';
    dPitch.textContent  = sensorPitch.toFixed(1)  + '°';
    dRef.textContent    = refRoll.toFixed(1)      + '°';

    if (!statusBar.classList.contains('recording') && !statusBar.classList.contains('locked'))
      statusBar.textContent = 'GYRO: ACTIVE';
  }

  async function requestGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        if (await DeviceOrientationEvent.requestPermission() === 'granted')
          window.addEventListener('deviceorientation', handleOrientation);
      } catch(e) { console.error(e); }
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }
  }

  // ── Canvas setup ───────────────────────────────────────────────────────────
  let srcW = 0, srcH = 0;
  let canvasW = 0, canvasH = 0;

  function initCanvasSize() {
    srcW = camFeed.videoWidth;
    srcH = camFeed.videoHeight;
    canvasW = window.innerWidth;
    canvasH = window.innerHeight;
    
    canvas.width  = canvasW;
    canvas.height = canvasH;
    
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  let orientationTimer;
  window.addEventListener('orientationchange', () => {
    if (isRecording) btnRecord.click(); 
    if (horizonLocked) btnHorizon.click(); 
    clearTimeout(orientationTimer);
    orientationTimer = setTimeout(() => { initCamera(true); }, 600); 
  });
  window.addEventListener('resize', () => { if(srcW) initCanvasSize(); });

  // ── Render loop ────────────────────────────────────────────────────────────
  function drawFrame(timestamp) {
    requestAnimationFrame(drawFrame);
    if (!srcW) return;

    // Calculate Delta Time
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000.0;
    lastTime = timestamp;
    
    // Guard against large time jumps
    if (dt > 0.1) dt = 0.016;
    if (dt < 0.001) dt = 0.016; // Minimum dt for stability

    // ── 1. Handle Screen Rotation Offset ─────────────────────────
    const currentScreenAngle = getScreenAngle();
    if (lastScreenAngle === null) lastScreenAngle = currentScreenAngle;
    
    if (currentScreenAngle !== lastScreenAngle) {
      let angleDiff = currentScreenAngle - lastScreenAngle;
      angleDiff = normalizeAngle(angleDiff);
      
      renderRoll -= angleDiff;
      refRoll -= angleDiff;
      
      lastScreenAngle = currentScreenAngle;
    }

    // ── 2. FIXED: Time-Based Smoothing (Frame Rate Independent) ──────────────
    // Using fixed time constants instead of variable responsiveness
    const tRoll  = 1.0 - Math.exp(-dt / SMOOTH_TIME_ROLL);
    const tPitch = 1.0 - Math.exp(-dt / SMOOTH_TIME_PITCH);
    
    renderRoll  = lerpAngle(renderRoll, sensorRoll, tRoll);
    renderPitch = lerp(renderPitch, sensorPitch, tPitch);

    // ── 3. CALCULATE CORRECTION ───────────────────────────────────
    let deltaRoll = normalizeAngle(renderRoll - refRoll);
    let correctionAngle = horizonLocked ? -signFlip * deltaRoll : 0;
    
    let deltaPitch = renderPitch - refPitch;
    let pitchCorrection = horizonLocked ? deltaPitch : 0;
    
    // FIXED: Increased limit and removed hard clamp for smoother behavior
    pitchCorrection = Math.max(-PITCH_MAX_CORRECTION, Math.min(PITCH_MAX_CORRECTION, pitchCorrection));

    // Update UI
    dCorr.textContent = correctionAngle.toFixed(1) + '°';
    const pct = Math.max(-1, Math.min(1, correctionAngle / 90));
    tiltFill.style.left = 'calc(50% + ' + (pct * 90) + 'px)';
    tiltValue.textContent = `R: ${correctionAngle.toFixed(1)}° | P: ${pitchCorrection.toFixed(1)}°`;

    // ── 4. DRAW ───────────────────────────────────────────────────
    const W = canvasW;
    const H = canvasH;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    
    ctx.translate(W / 2, H / 2);

    const srcDiag = Math.sqrt(srcW * srcW + srcH * srcH);
    const fovRad = 55 * (Math.PI / 180); 
    const srcFocalLen = (srcDiag / 2) / Math.tan(fovRad / 2);

    const vidScale = Math.max(W / srcW, H / srcH);
    const drawW = srcW * vidScale;
    const drawH = srcH * vidScale;

    const canvasFocalLen = srcFocalLen * vidScale;
    
    let ty = -canvasFocalLen * Math.tan(pitchCorrection * Math.PI / 180);

    const corrRad = correctionAngle * Math.PI / 180;
    const cosA = Math.abs(Math.cos(corrRad));
    const sinA = Math.abs(Math.sin(corrRad));

    let baseReqW = W * cosA + H * sinA;
    let baseReqH = W * sinA + H * cosA;

    let scaleX = baseReqW / drawW;
    let scaleY = (baseReqH + 2 * Math.abs(ty)) / drawH;
    
    let finalScale = Math.max(scaleX, scaleY);
    finalScale *= 1.02;
    finalScale = Math.min(finalScale, 3.5);

    ctx.rotate(corrRad);
    ctx.translate(0, ty); 
    ctx.scale(finalScale, finalScale);
    
    ctx.drawImage(camFeed, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  async function initCamera(isReset = false) {
    if (!isReset) {
      btnStart.textContent = 'LOADING...';
      btnStart.disabled = true;
    }
    
    if (rawStream) rawStream.getTracks().forEach(t => t.stop());

    try {
      rawStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: true
      });
      camFeed.srcObject = rawStream;
      await new Promise(r => { camFeed.onloadedmetadata = r; });
      await camFeed.play();
      initCanvasSize();
      
      if (!isReset) {
        await requestGyro();
        permOverlay.style.display = 'none';
        
        renderRoll = sensorRoll;
        renderPitch = sensorPitch;
        lastScreenAngle = getScreenAngle();
        
        lastTime = 0;
        systemReady = true;
        requestAnimationFrame(drawFrame);
        canvasStream = canvas.captureStream(30);
      }
    } catch (err) {
      if (!isReset) {
        btnStart.textContent = 'RETRY';
        btnStart.disabled = false;
        let msg = err.message || 'PERMISSION DENIED';
        if (err.name === 'NotAllowedError')  msg = 'CAMERA PERMISSION DENIED';
        if (err.name === 'NotFoundError')    msg = 'NO CAMERA FOUND';
        if (err.name === 'NotReadableError') msg = 'CAMERA IN USE BY ANOTHER APP';
        errorMsg.style.display = 'block';
        errorMsg.textContent = '⚠ ' + msg;
      }
    }
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  btnHorizon.addEventListener('click', () => {
    horizonLocked = !horizonLocked;
    if (horizonLocked) {
      refRoll = renderRoll;
      refPitch = renderPitch;
      
      btnHorizon.classList.add('active');
      horizonLine.classList.add('active');
      tiltInd.classList.add('visible');
      statusBar.className   = 'locked';
      statusBar.textContent = 'HORIZON LOCKED';
    } else {
      btnHorizon.classList.remove('active');
      horizonLine.classList.remove('active');
      tiltInd.classList.remove('visible');
      statusBar.className   = '';
      statusBar.textContent = gyroActive ? 'GYRO: ACTIVE' : 'GYRO: STANDBY';
    }
  });

  btnFlip.addEventListener('click', () => {
    signFlip *= -1;
    btnFlip.classList.toggle('active', signFlip === -1);
    if (horizonLocked) {
      refRoll = renderRoll;
      refPitch = renderPitch;
    }
  });

  btnRecord.addEventListener('click', () => {
    if (!rawStream) return;
    isRecording ? stopRecording() : startRecording();
  });

  function pickMime() {
    const list = ['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm;codecs=vp9,opus','video/webm;codecs=vp9','video/webm'];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch(e) {} }
    return '';
  }

  function startRecording() {
    chunks = []; intentionalStop = false;
    let recStream;
    if (canvasStream && canvasStream.getVideoTracks().length > 0) {
      recStream = new MediaStream([...canvasStream.getVideoTracks(), ...rawStream.getAudioTracks()]);
    } else {
      recStream = rawStream;
    }
    const mime = pickMime();
    try { mediaRecorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : {}); }
    catch(e) { mediaRecorder = new MediaRecorder(recStream); }

    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onerror = e => console.error('MediaRecorder error', e);
    mediaRecorder.onstop  = () => { if (intentionalStop && chunks.length > 0) saveVideo(); };
    mediaRecorder.start(2000);

    isRecording = true;
    btnRecord.classList.add('recording');
    recStart = Date.now();
    recTimer.classList.add('visible');
    statusBar.className   = 'recording';
    statusBar.textContent = '● RECORDING';
    recInterval = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      recTimeEl.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    }, 500);
  }

  function stopRecording() {
    intentionalStop = true; isRecording = false;
    mediaRecorder.stop();
    btnRecord.classList.remove('recording');
    recTimer.classList.remove('visible');
    clearInterval(recInterval);
    statusBar.className   = horizonLocked ? 'locked' : '';
    statusBar.textContent = horizonLocked ? 'HORIZON LOCKED' : gyroActive ? 'GYRO: ACTIVE' : 'GYRO: STANDBY';
  }

  let recStart = null;
  let recInterval = null;
  
  function saveVideo() {
    const mime = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
    const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'horizon-lock-' + Date.now() + '.' + ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  btnStart.addEventListener('click', () => initCamera(false));
})();
