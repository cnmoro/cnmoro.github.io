<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real-Time Pixel Camera</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #outputCanvas {
      flex: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Portrait mode controls (default) */
    #captureButton,
    #toggleSettings,
    #fullscreenButton {
      position: fixed;
      bottom: 30px;
      z-index: 200;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    #captureButton {
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid rgba(255, 255, 255, 0.3);
    }

    #captureButton:active {
      transform: translateX(-50%) scale(0.9);
      background: rgba(200, 200, 200, 0.9);
    }

    #captureButton::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: red;
    }

    #toggleSettings {
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
    }

    #toggleSettings:active {
      transform: scale(0.9);
      background: rgba(200, 200, 200, 0.8);
    }

    #fullscreenButton {
      left: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #333;
    }

    #fullscreenButton:active {
      transform: scale(0.9);
      background: rgba(200, 200, 200, 0.8);
    }

    /* Landscape mode adjustments */
    @media (orientation: landscape) {
      /* Move controls to right side */
      #captureButton,
      #toggleSettings,
      #fullscreenButton {
        bottom: auto;
        left: auto;
        right: 20px;
        transform: translateY(-50%);
      }
      
      #captureButton {
        top: 50%;
        width: 60px;
        height: 60px;
      }
      
      #captureButton::before {
        width: 42px;
        height: 42px;
      }
      
      #toggleSettings {
        top: calc(50% - 80px);
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
      
      #fullscreenButton {
        top: calc(50% + 80px);
        width: 44px;
        height: 44px;
        font-size: 18px;
      }
    }

    /* Settings controls */
    #settingsContainer {
      position: fixed;
      z-index: 250; /* Higher than action buttons */
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
      /* Ensure it's completely hidden when not visible */
      visibility: hidden;
      opacity: 0;
    }

    /* Portrait settings panel */
    #settingsContainer.portrait {
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 60vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                  visibility 0.4s, opacity 0.4s;
    }

    #settingsContainer.portrait.visible {
      transform: translateY(0);
      visibility: visible;
      opacity: 1;
    }

    /* Landscape settings panel */
    #settingsContainer.landscape {
      top: 50%;
      right: -280px; /* Start completely off-screen to the right */
      width: 280px;
      max-height: 80vh;
      border-radius: 16px;
      transform: translateY(-50%);
      transition: right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                  visibility 0.4s, opacity 0.4s;
    }

    #settingsContainer.landscape.visible {
      right: 20px; /* Slide in to 20px from right edge */
      visibility: visible;
      opacity: 1;
    }

    .settings-header {
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .settings-title {
      color: white;
      font-size: 18px;
      font-weight: 600;
    }

    #closeSettings {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #closeSettings:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .settings-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .setting-control {
      background: rgba(30, 30, 40, 0.6);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .setting-label {
      color: white;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .setting-label::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: #4a90e2;
      border-radius: 2px;
      margin-right: 10px;
    }

    .slider-container {
      position: relative;
      height: 40px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      cursor: grab;
      user-select: none;
    }

    .slider-container:active {
      cursor: grabbing;
    }

    .slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #4a90e2;
      border-radius: 20px;
      pointer-events: none;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .slider-value {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }

    .palette-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .palette-option {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      overflow: hidden;
    }

    .palette-option:hover {
      transform: scale(1.1);
    }

    .palette-option.active {
      border-color: white;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .palette-color {
      flex: 1;
    }

    .checkbox-control {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 0;
    }

    .checkbox-control input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #4a90e2;
    }

    select {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      appearance: none;
      background-image: url("image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 40px;
    }

    select option {
      background: #222;
      color: white;
    }

    .app-title {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      z-index: 100;
      pointer-events: none;
      opacity: 0.7;
      user-select: none;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Scrollbar styling */
    .settings-content::-webkit-scrollbar {
      width: 6px;
    }

    .settings-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .settings-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    /* Responsive adjustments for larger screens */
    @media (min-width: 769px) and (orientation: portrait) {
      #captureButton {
        bottom: 40px;
        width: 80px;
        height: 80px;
      }
      
      #captureButton::before {
        width: 60px;
        height: 60px;
      }
      
      #toggleSettings, #fullscreenButton {
        bottom: 40px;
        width: 60px;
        height: 60px;
        font-size: 28px;
      }
    }

    @media (max-height: 600px) and (orientation: portrait) {
      #settingsContainer.portrait {
        max-height: 50vh;
      }
      
      .setting-control {
        padding: 12px;
        margin-bottom: 12px;
      }
      
      .slider-container {
        height: 36px;
      }
      
      .slider-thumb {
        width: 24px;
        height: 24px;
      }
      
      .palette-option {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>
  <canvas id="outputCanvas"></canvas>

  <div class="app-title">cnmoro's pixel camera</div>
  
  <button id="fullscreenButton">⛶</button>
  <button id="captureButton"></button>
  <button id="toggleSettings">⚙</button>
  
  <div id="settingsContainer" class="portrait">
    <div class="settings-header">
      <div class="settings-title">Camera Settings</div>
      <button id="closeSettings">✕</button>
    </div>
    <div class="settings-content">
      <div class="setting-control">
        <div class="setting-label">Camera</div>
        <select id="cameraSelect"></select>
      </div>

      <div class="setting-control">
        <div class="setting-label">Palette</div>
        <div class="palette-selector" id="paletteSelector"></div>
      </div>

      <div class="setting-control">
        <div class="setting-label">Pixel Scale</div>
        <div class="slider-container" data-slider="pixelSize" data-min="4" data-max="32" data-value="8">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
          <div class="slider-value">8</div>
        </div>
      </div>

      <div class="setting-control">
        <div class="setting-label">Brightness</div>
        <div class="slider-container" data-slider="brightness" data-min="0" data-max="2" data-step="0.1" data-value="1">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
          <div class="slider-value">1.0</div>
        </div>
      </div>

      <div class="setting-control">
        <div class="setting-label">Contrast</div>
        <div class="slider-container" data-slider="contrast" data-min="0" data-max="2" data-step="0.1" data-value="1">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
          <div class="slider-value">1.0</div>
        </div>
      </div>

      <div class="setting-control">
        <label class="checkbox-control">
          <input type="checkbox" id="softFocusToggle">
          <span>Soft Focus</span>
        </label>
      </div>
    </div>
  </div>

  <script>
    const palettes = {
      'none': null,
      'digital-paper': [[245, 245, 245], [145, 163, 170], [76, 86, 113], [5, 5, 5]],
      'eulbink': [[255, 255, 255], [12, 230, 242], [0, 152, 219], [30, 87, 156], [32, 53, 98], [37, 36, 70], [32, 21, 51]],
      'human16': [[204, 121, 167], [213, 94, 0], [230, 159, 0], [240, 228, 66], [0, 158, 115], [86, 180, 233], [0, 114, 178], [101, 77, 115], [0, 0, 0], [174, 179, 184], [255, 255, 255], [43, 35, 28], [76, 52, 42], [143, 109, 69], [175, 146, 113], [228, 208, 181]],
      'ice-cream-gb': [[124, 63, 88], [235, 107, 111], [249, 168, 117], [255, 246, 211]],
      'lava-gb': [[5, 31, 57], [74, 36, 128], [197, 58, 157], [255, 142, 128]],
      'midnight-ablaze': [[255, 130, 116], [213, 60, 106], [124, 24, 60], [70, 14, 43], [49, 5, 30], [31, 5, 16], [19, 2, 8]],
      'oil-6': [[251, 245, 239], [242, 211, 171], [198, 159, 165], [139, 109, 156], [73, 77, 126], [39, 39, 68]],
      'rust-gold-8': [[246, 205, 38], [172, 107, 38], [86, 50, 38], [51, 28, 23], [187, 127, 87], [114, 89, 86], [57, 57, 57], [32, 32, 32]],
      'simple-feudal-japanese': [[250, 251, 255], [242, 219, 188], [219, 199, 169], [92, 85, 75], [35, 35, 31], [23, 23, 22], [5, 5, 5], [229, 177, 198], [216, 142, 180], [193, 132, 151], [170, 109, 125], [186, 67, 71], [117, 44, 34], [90, 35, 34], [247, 226, 136], [223, 192, 128], [225, 195, 78], [224, 192, 8], [162, 169, 115], [113, 112, 100], [47, 117, 88], [33, 115, 63], [34, 65, 50], [148, 169, 232], [101, 111, 168], [81, 97, 165], [68, 82, 153], [35, 69, 121], [17, 41, 91], [28, 34, 66]],
      'slso8': [[13, 43, 69], [32, 60, 86], [84, 78, 104], [141, 105, 122], [208, 129, 89], [255, 170, 94], [255, 212, 163], [255, 236, 214]],
      'twilight-5': [[251, 187, 173], [238, 134, 149], [74, 122, 150], [51, 63, 88]]
    };

    let currentStream;
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d');
    let targetWidth = 256;
    let pixelScale = 4;
    let selectedPalette = null;
    let brightnessFactor = 1.0;
    let contrastFactor = 1.0;
    let softFocusEnabled = false;
    let isLandscape = false;

    const fullSizeCanvas = document.createElement('canvas');
    const fullSizeCtx = fullSizeCanvas.getContext('2d');

    // Check orientation and update layout
    function updateOrientation() {
      const isNowLandscape = window.matchMedia("(orientation: landscape)").matches;
      
      if (isNowLandscape !== isLandscape) {
        isLandscape = isNowLandscape;
        const settingsContainer = document.getElementById('settingsContainer');
        
        // Remove both classes first
        settingsContainer.classList.remove('portrait', 'landscape');
        
        // Add the appropriate class
        if (isLandscape) {
          settingsContainer.classList.add('landscape');
        } else {
          settingsContainer.classList.add('portrait');
        }
        
        // Hide settings when orientation changes
        settingsContainer.classList.remove('visible');
      }
    }

    // Drag slider functionality
    function initSliders() {
      const sliders = document.querySelectorAll('.slider-container');
      
      sliders.forEach(slider => {
        const min = parseFloat(slider.dataset.min);
        const max = parseFloat(slider.dataset.max);
        const step = parseFloat(slider.dataset.step || 1);
        let value = parseFloat(slider.dataset.value);
        
        const fill = slider.querySelector('.slider-fill');
        const thumb = slider.querySelector('.slider-thumb');
        const valueDisplay = slider.querySelector('.slider-value');
        
        function updateSlider(val) {
          value = Math.max(min, Math.min(max, val));
          const percent = ((value - min) / (max - min)) * 100;
          fill.style.width = percent + '%';
          thumb.style.left = percent + '%';
          
          // Format display value
          if (step < 1) {
            valueDisplay.textContent = value.toFixed(1);
          } else {
            valueDisplay.textContent = Math.round(value);
          }
          
          // Update actual values
          const sliderName = slider.dataset.slider;
          if (sliderName === 'pixelSize') {
            pixelScale = Math.round(value);
            targetWidth = Math.max(16, Math.floor(window.innerWidth / pixelScale));
          } else if (sliderName === 'brightness') {
            brightnessFactor = value;
          } else if (sliderName === 'contrast') {
            contrastFactor = value;
          }
        }
        
        function handleMove(clientX) {
          const rect = slider.getBoundingClientRect();
          const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
          let newValue = min + percent * (max - min);
          
          // Snap to step
          newValue = Math.round(newValue / step) * step;
          updateSlider(newValue);
        }
        
        let isDragging = false;
        
        // Mouse events
        slider.addEventListener('mousedown', (e) => {
          isDragging = true;
          handleMove(e.clientX);
        });
        
        document.addEventListener('mousemove', (e) => {
          if (isDragging) {
            handleMove(e.clientX);
          }
        });
        
        document.addEventListener('mouseup', () => {
          isDragging = false;
        });
        
        // Touch events
        slider.addEventListener('touchstart', (e) => {
          isDragging = true;
          handleMove(e.touches[0].clientX);
        });
        
        document.addEventListener('touchmove', (e) => {
          if (isDragging) {
            handleMove(e.touches[0].clientX);
            e.preventDefault();
          }
        }, { passive: false });
        
        document.addEventListener('touchend', () => {
          isDragging = false;
        });
        
        // Initialize
        updateSlider(value);
      });
    }

    // Palette selector
    function initPaletteSelector() {
      const container = document.getElementById('paletteSelector');
      
      Object.keys(palettes).forEach(name => {
        const option = document.createElement('div');
        option.className = 'palette-option';
        if (name === 'none') option.classList.add('active');
        option.dataset.palette = name;
        
        const palette = palettes[name];
        if (palette) {
          const colorsToShow = palette.slice(0, 4);
          colorsToShow.forEach(color => {
            const colorDiv = document.createElement('div');
            colorDiv.className = 'palette-color';
            colorDiv.style.background = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
            option.appendChild(colorDiv);
          });
        } else {
          // "None" palette - show gradient
          option.style.background = 'linear-gradient(45deg, #f00, #0f0, #00f)';
          option.style.opacity = '0.5';
        }
        
        option.addEventListener('click', () => {
          document.querySelectorAll('.palette-option').forEach(el => el.classList.remove('active'));
          option.classList.add('active');
          selectedPalette = palettes[name];
        });
        
        container.appendChild(option);
      });
    }

    function resizeCanvas() {
      outputCanvas.width = window.innerWidth;
      outputCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      updateOrientation();
    });
    resizeCanvas();
    updateOrientation();

    async function initializeCamera(deviceId) {
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: deviceId ? undefined : 'environment'
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.createElement('video');
        video.srcObject = currentStream;
        video.setAttribute('playsinline', '');
        await video.play();
        processVideo(video);
      } catch (error) {
        console.error('Error accessing camera:', error);
      }
    }

    function processVideo(video) {
      const processFrame = () => {
        if (video.videoWidth === 0) {
          requestAnimationFrame(processFrame);
          return;
        }

        const videoAspect = video.videoWidth / video.videoHeight;
        const canvasAspect = outputCanvas.width / outputCanvas.height;
        
        let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
        
        if (videoAspect > canvasAspect) {
          drawHeight = outputCanvas.height;
          drawWidth = drawHeight * videoAspect;
          offsetX = -(drawWidth - outputCanvas.width) / 2;
        } else {
          drawWidth = outputCanvas.width;
          drawHeight = drawWidth / videoAspect;
          offsetY = -(drawHeight - outputCanvas.height) / 2;
        }

        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = targetWidth;
        tempCanvas.height = Math.round(targetWidth / videoAspect);

        if (softFocusEnabled) {
          fullSizeCanvas.width = video.videoWidth;
          fullSizeCanvas.height = video.videoHeight;
          fullSizeCtx.filter = 'blur(1.5px)';
          fullSizeCtx.drawImage(video, 0, 0);
          tempCtx.drawImage(fullSizeCanvas, 0, 0, tempCanvas.width, tempCanvas.height);
        } else {
          tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
        }

        const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          let r = data[i] * brightnessFactor;
          let g = data[i + 1] * brightnessFactor;
          let b = data[i + 2] * brightnessFactor;

          r = (r - 128) * contrastFactor + 128;
          g = (g - 128) * contrastFactor + 128;
          b = (b - 128) * contrastFactor + 128;

          data[i] = Math.min(255, Math.max(0, r));
          data[i + 1] = Math.min(255, Math.max(0, g));
          data[i + 2] = Math.min(255, Math.max(0, b));
        }

        quantizeColors(data, selectedPalette);
        tempCtx.putImageData(imageData, 0, 0);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
        
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tempCanvas, offsetX, offsetY, drawWidth, drawHeight);

        requestAnimationFrame(processFrame);
      };
      processFrame();
    }

    function quantizeColors(data, palette) {
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        if (palette) {
          let minDist = Infinity;
          let closestColor = palette[0];
          for (const color of palette) {
            const dist = Math.sqrt(
              Math.pow(color[0] - r, 2) +
              Math.pow(color[1] - g, 2) +
              Math.pow(color[2] - b, 2)
            );
            if (dist < minDist) {
              minDist = dist;
              closestColor = color;
            }
          }
          data[i] = closestColor[0];
          data[i + 1] = closestColor[1];
          data[i + 2] = closestColor[2];
        } else {
          r = Math.round(r / 85) * 85;
          g = Math.round(g / 85) * 85;
          b = Math.round(b / 85) * 85;
          data[i] = Math.min(r, 255);
          data[i + 1] = Math.min(g, 255);
          data[i + 2] = Math.min(b, 255);
        }
      }
    }

    async function populateCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(device => device.kind === 'videoinput');
      const select = document.getElementById('cameraSelect');

      select.innerHTML = videoDevices
        .map((device, i) => `<option value="${device.deviceId}">${device.label || `Camera ${i + 1}`}</option>`)
        .join('');

      select.addEventListener('change', () => initializeCamera(select.value));
    }

    document.getElementById('softFocusToggle').addEventListener('change', (e) => {
      softFocusEnabled = e.target.checked;
    });

    document.getElementById('captureButton').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = outputCanvas.toDataURL('image/png');
      link.download = `pixel-camera-${Date.now()}.png`;
      link.click();
    });

    // Toggle settings visibility
    const toggleButton = document.getElementById('toggleSettings');
    const closeSettings = document.getElementById('closeSettings');
    const settingsContainer = document.getElementById('settingsContainer');
    let settingsVisible = false;

    function toggleSettings() {
      settingsVisible = !settingsVisible;
      if (settingsVisible) {
        settingsContainer.classList.add('visible');
      } else {
        settingsContainer.classList.remove('visible');
      }
    }

    toggleButton.addEventListener('click', toggleSettings);
    closeSettings.addEventListener('click', toggleSettings);

    // Fullscreen functionality
    const fullscreenButton = document.getElementById('fullscreenButton');
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable fullscreen: ${err.message}`);
        });
        fullscreenButton.textContent = '❐';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fullscreenButton.textContent = '⛶';
        }
      }
    }
    
    fullscreenButton.addEventListener('click', toggleFullscreen);
    
    // Update button text when exiting fullscreen via ESC
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenButton.textContent = '⛶';
      }
    });

    // Initialize everything
    initSliders();
    initPaletteSelector();
    populateCameras();
    initializeCamera();

    navigator.mediaDevices.addEventListener('devicechange', populateCameras);
  </script>
</body>
</html>
